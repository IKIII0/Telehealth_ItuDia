name: telehealth_app
description: "Telehealth Remote Monitoring — aplikasi pemantauan kesehatan jarak jauh untuk pasien, dokter, dan keluarga."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  dio: ^5.10.0
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - .env
